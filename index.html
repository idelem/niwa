<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>niwa</title>
<style>
:root{
  --bg:#eceee6; --fg:#1d241f; --hl:#2c6e8f;
  --dim:color-mix(in srgb, var(--fg) 48%, var(--bg));
  --faint:color-mix(in srgb, var(--fg) 10%, var(--bg));
  --light:#eceee6;
  --rows:8;
  --gut:3.4rem;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;border-radius:0;box-shadow:none}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;outline:none}
button{cursor:pointer}
::selection{background:var(--hl);color:var(--bg)}
button:focus-visible{background:var(--hl);color:var(--bg)}
input:focus,textarea:focus{background:var(--faint)}
.dim{color:var(--dim)}

/* layout */
.app{height:100%;display:grid;grid-template-columns:9.5rem repeat(3,minmax(0,1fr)) minmax(0,1.5fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:1.25rem;padding:1.75rem 1.5rem 1rem}
.c0{grid-column:1;grid-row:1}.c1{grid-column:2;grid-row:1}.c2{grid-column:3;grid-row:1}.c3{grid-column:4;grid-row:1}
.rel{grid-column:5;grid-row:1/3;min-height:0;overflow-y:auto;scrollbar-width:none}
.pcell{grid-column:1;grid-row:2;align-self:start;display:flex;align-items:baseline;justify-content:flex-end;padding-top:.7rem;font-size:.95rem;color:var(--dim);min-width:0}
.pbody{grid-column:2/5;grid-row:2;min-width:0;min-height:0;display:flex;flex-direction:column;padding-top:.6rem}
.foot{grid-column:1/-1;grid-row:3;display:flex;justify-content:space-between;align-items:center;gap:1rem;min-height:2rem;padding-top:.5rem;font-size:.85rem;color:var(--dim)}

/* nav columns */
.list{position:relative;height:calc(var(--rows) * 1.75em);overflow-y:auto;scrollbar-width:none}
.list::-webkit-scrollbar,.rel::-webkit-scrollbar,.ovb::-webkit-scrollbar{display:none}
.list.more{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 1.6em),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 1.6em),transparent)}
.it{height:1.75em;line-height:1.75em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.it:hover,.rl:hover .t{color:var(--hl)}
.it.cur{font-weight:700}
.it.ghost,.rl.ghost{color:var(--dim);font-style:italic}
.addrow{height:1.75em;display:flex;align-items:center}
.add{height:100%;padding:0 .6em 0 0;color:var(--dim)}
.add:hover{color:var(--hl)}
.inl{width:100%;min-width:0;height:100%;padding:0 .3em;background:var(--faint)}

/* related grid */
.grid{display:grid;grid-template-columns:repeat(var(--gc),minmax(0,1fr));grid-auto-rows:1.75em;column-gap:.75rem}
.cell{min-width:0;display:flex;align-items:center;cursor:pointer}
.cell:empty:hover::after{content:"+";color:var(--dim)}
.rl{min-width:0;display:flex;align-items:center;cursor:pointer;line-height:1.75em}
.rl .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl a.t{color:inherit;text-decoration:none}
.rl .x{display:none;color:var(--dim);padding:0 .2em}
.rl:hover .x{display:block}
.rl .x:hover{color:var(--hl)}

/* page head */
.par{flex:1;min-width:0;text-align:right;color:var(--dim)}
.par:focus{color:var(--fg)}
.title{display:block;width:100%;font-size:1.9rem;line-height:1.25;font-weight:500}
.slug{margin-top:.2rem;height:1.6em;font-size:.85rem;color:var(--dim);min-width:4ch;max-width:100%}
.slug:focus{color:var(--fg)}

/* blocks */
.blocks{flex:1;min-height:0;margin:1rem 0 0 calc(var(--gut) * -1);padding:0 0 3rem var(--gut);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
.blk{position:relative}
.blk.dragging{opacity:.35}
.gut{position:absolute;right:100%;top:.2rem;display:flex;align-items:center;padding-right:.3rem;opacity:0}
.blk:hover .gut,.gut:focus-within{opacity:1}
.bt{height:1.4rem;line-height:1.4rem;padding:0 .3rem;color:var(--dim)}
.bt:hover{color:var(--hl)}
.hd{cursor:grab;padding:0 .25rem;color:var(--dim);user-select:none;line-height:1.4rem}
.hd:hover{color:var(--hl)}
.ins{position:relative;height:.95rem;margin-left:calc(var(--gut) * -1);padding-left:var(--gut)}
.ins::after{content:"";position:absolute;left:var(--gut);right:0;top:50%;height:1px;background:var(--dim);opacity:0;pointer-events:none}
.ins:hover::after{opacity:.5}
.ins.drop::after{opacity:1;height:2px;background:var(--hl)}
.ib{position:absolute;left:0;width:var(--gut);top:50%;transform:translateY(-50%);display:flex;justify-content:flex-end;padding-right:.3rem;opacity:0}
.ins:hover .ib,.ins.always .ib{opacity:1}
.bta{display:block;width:100%;min-height:1.8em;resize:none;overflow:hidden;line-height:1.8;font-size:1rem}
.md{line-height:1.8;font-size:1rem;min-height:1.8em;cursor:text;overflow-wrap:anywhere}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.3;margin:1.1em 0 .4em;font-weight:600}
.md h1{font-size:1.5rem}.md h2{font-size:1.25rem}.md h3{font-size:1.1rem}.md h4,.md h5,.md h6{font-size:1rem}
.md p,.md ul,.md ol,.md blockquote,.md pre{margin:.5em 0}
.md ul,.md ol{padding-left:1.4em}
.md a{color:var(--hl)}
.md a.ghost{color:var(--dim);font-style:italic}
.md code{font:.88em ui-monospace,Menlo,Consolas,monospace;background:var(--faint);padding:.1em .3em}
.md pre{background:var(--faint);padding:.6em .8em;overflow-x:auto}
.md pre code{background:none;padding:0}
.md blockquote{margin-left:0;padding-left:1em;color:var(--dim)}
.md hr{border:0;height:1px;background:var(--dim);margin:1em 0}
.md img{max-width:100%}
.md table{border-collapse:collapse}
.md th,.md td{padding:.25em .8em;text-align:left}
.md th{background:var(--faint)}
.pic{display:block;max-width:100%;height:auto}
.duo{display:block;width:fit-content;max-width:100%;background:var(--light);isolation:isolate;line-height:0}
.duo img,.duo canvas{mix-blend-mode:multiply}
.pic.px{image-rendering:pixelated}
.bimg{padding:.2rem 0}
.bimg:focus{background:var(--faint)}
.bimg .bact{display:none;gap:.25rem;margin-top:.3rem}
.blk:hover .bimg .bact,.bimg.empty .bact{display:flex}

/* backlinks */
.back{margin-top:2rem;color:var(--dim)}
.back .bh{margin-bottom:.3rem}
.bl{padding:.15rem 0;cursor:pointer}
.bl:hover{color:var(--hl)}
.bl .sn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* footer */
.btns{display:flex;gap:.25rem;flex-shrink:0}
.btn{height:1.9em;padding:.1em .6em;color:var(--fg)}
.btn:hover{color:var(--hl)}
.btn:disabled{color:var(--dim);opacity:.5;cursor:default}
.btn.on{color:var(--hl);font-weight:700}
.btn.sm{height:1.6em;font-size:.85rem;padding:0 .5em;color:var(--dim)}
.btn.sm:hover{color:var(--hl)}
.btn.go,.btn.sm.go{background:var(--hl);color:var(--bg)}
.btn.go:hover{color:var(--bg)}
.left{display:flex;align-items:center;min-width:0;flex-wrap:wrap;gap:0 .75rem}
.confirm{display:inline-flex;align-items:center;gap:.5rem;flex-wrap:wrap;color:var(--fg)}

/* overlay */
#ov{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;background:var(--bg);padding:calc(1.75rem + env(safe-area-inset-top,0px)) 1.5rem calc(1rem + env(safe-area-inset-bottom,0px))}
#ov[hidden]{display:none}
.ovh{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;color:var(--dim)}
.ovb{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;max-width:46rem}
.big{width:100%;font-size:1.5rem;padding:.2rem .3rem;margin-bottom:1rem;background:var(--faint)}
.hit{padding:.3rem .4rem;cursor:pointer}
.hit:hover{background:var(--faint)}
.hit.sel{background:var(--hl);color:var(--bg)}
.hit.sel .dim{color:inherit;opacity:.75}
.snip{font-size:.85rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit.sel .snip{color:inherit;opacity:.75}
.mn{padding:.1rem 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn:hover{color:var(--hl)}
.mn.cur{font-weight:700}
.st section{margin-bottom:2rem}
.st h3{margin:0 0 .6rem;font-size:1rem}
.row{display:flex;flex-wrap:wrap;gap:.25rem 1rem;align-items:center;margin-bottom:.6rem}
.cl{display:inline-flex;align-items:center;gap:.4rem}
input[type=color]{width:2.2rem;height:1.5rem;padding:0;cursor:pointer;background:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0}
input[type=color]::-moz-color-swatch{border:0}
input[type=range]{width:11rem;accent-color:var(--hl);cursor:pointer}
.io{width:100%;height:9rem;padding:.5rem;background:var(--faint);font:.8rem/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.msg{min-height:1.5em;margin-top:.5rem}

.ovb.map{max-width:none;overflow:hidden;display:flex}
.mapwrap{display:flex;flex:1;gap:1.5rem;min-width:0;min-height:0}
.maptree{flex:0 0 17rem;min-height:0;overflow-y:auto;scrollbar-width:none}
.maptree::-webkit-scrollbar{display:none}
.mapgraph{position:relative;flex:1;min-width:0;min-height:0;background:var(--faint);overflow:hidden}
.mapgraph .legend,.mapgraph .gmsg{position:absolute;left:.75rem;font-size:.8rem;color:var(--dim);pointer-events:none}
.mapgraph .legend{bottom:.5rem}
.mapgraph .gmsg{top:.5rem}

/* image dialog */
.prevbox{max-height:48vh;overflow:auto;margin-bottom:1rem;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
.prev{display:block;max-width:100%}
.lab{display:inline-block;min-width:4.5rem;color:var(--dim)}
.val{display:inline-block;min-width:2.5rem;color:var(--dim);text-align:right}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:1.5rem 1rem;align-items:start}
.gth{display:flex;align-items:center;justify-content:center;min-height:6rem;max-height:10rem;overflow:hidden;background:var(--faint)}
.gth img{max-width:100%;max-height:10rem;width:auto;height:auto}
.gth.pk{cursor:pointer}
.gth.pk:hover{opacity:.8}
.gm{font-size:.8rem;margin-top:.3rem}
.gu{font-size:.8rem;margin-top:.1rem}
.gl{cursor:pointer;color:var(--hl)}
.gname{width:100%;font-size:.85rem;margin-top:.2rem;color:var(--dim)}
.gname:focus{color:var(--fg)}
.gd{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem;font-size:.8rem;margin-top:.2rem}

@media (max-width:820px){
  :root{--gut:0rem}
  .app{height:auto;min-height:100%;grid-template-columns:3.2rem repeat(3,minmax(0,1fr));grid-template-rows:auto auto auto auto auto;column-gap:.75rem;padding:1rem}
  .rel{grid-column:1/-1;grid-row:4;height:15rem;margin-top:1rem}
  .pcell{grid-column:1/-1;grid-row:2;justify-content:flex-start;padding-top:1rem}
  .par{text-align:left;flex:0 1 auto;width:12rem}
  .pbody{grid-column:1/-1;grid-row:3;min-height:60vh}
  .foot{grid-row:5;margin-top:1rem}
  .gut,.ib{display:none}
  .mapwrap{flex-direction:column}
  .maptree{flex:0 0 12rem}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
</head>
<body>
<div class="app" id="app">
  <div class="c0" id="c0"></div>
  <div class="c1" id="c1"></div>
  <div class="c2" id="c2"></div>
  <div class="c3" id="c3"></div>
  <div class="rel" id="rel"></div>
  <div class="pcell" id="pcell"></div>
  <div class="pbody" id="pbody"></div>
  <div class="foot">
    <div class="left"><span id="status"></span><span id="confirm" class="confirm"></span><span id="undo" class="confirm"></span></div>
    <div class="btns">
      <button class="btn" id="bSearch" type="button">搜索</button>
      <button class="btn" id="bMap" type="button">地图</button>
      <button class="btn" id="bImg" type="button">图片</button>
      <button class="btn" id="bSet" type="button">设置</button>
      <button class="btn" id="del" type="button">删除</button>
    </div>
  </div>
</div>
<div id="ov" hidden></div>
<datalist id="slugs"></datalist>
<input type="file" id="imgfile" accept="image/*" hidden>

<script>
(function(){
"use strict";

/* ---------- constants & helpers ---------- */
const ROOT="~", GC=2;           // ROOT: slug of the root page; GC: columns in the related grid
const MIME="application/x-niwa-block";
const $=id=>document.getElementById(id);
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
function h(tag,props,...kids){
  const parts=tag.split("."), el=document.createElement(parts[0]||"div");
  if(parts.length>1) el.className=parts.slice(1).join(" ");
  for(const k in (props||{})){
    const v=props[k];
    if(v==null||v===false) continue;
    if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(k==="list"||k.indexOf("-")>0||k==="tabindex") el.setAttribute(k,v);
    else if(k==="style") el.style.cssText=v;
    else if(k in el) el[k]=v;
    else el.setAttribute(k,v);
  }
  kids.flat().forEach(c=>{ if(c!=null&&c!==false) el.append(c.nodeType?c:String(c)); });
  return el;
}
const sanitize=s=>(s||"").trim().replace(/[\s\/\\#?%()\[\]<>]+/g,"-").replace(/^-+|-+$/g,"");
const SCHEME=/^[a-z][a-z0-9+.-]*:/i;
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const hostOf=u=>{ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return u; } };
function linkTarget(href){ let t=href.trim(); try{ t=decodeURIComponent(t); }catch(e){} return t.replace(/^\.\//,""); }
const now=()=>Date.now();
const chw=s=>[...s].reduce((n,c)=>n+(c.charCodeAt(0)>255?2:1),0)+1;
const isComposing=e=>e.isComposing||e.keyCode===229;
let uidN=0;
const uid=()=>now().toString(36).slice(-4)+Math.random().toString(36).slice(2,7)+(uidN++).toString(36);
const fmtKB=n=>n<102400?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB";

/* ---------- theme (fg / bg / highlight) ---------- */
const PRESETS={
  "庭":{bg:"#eceee6",fg:"#1d241f",hl:"#2c6e8f"},
  "白":{bg:"#ffffff",fg:"#1a1a1a",hl:"#2457d6"},
  "夜":{bg:"#14171a",fg:"#cfd5cf",hl:"#8fc1d4"}
};
let theme=null;
function lum(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex); if(!m) return 0;
  const n=parseInt(m[1],16), f=c=>{ c/=255; return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4); };
  return .2126*f((n>>16)&255)+.7152*f((n>>8)&255)+.0722*f(n&255);
}
// favicon: uses the darker of fg/bg when the browser is in light mode, the lighter one in dark mode
function updateFavicon(t){
  try{
    const dk=t.hl, lt=t.hl;//lum(t.fg)<=lum(t.bg)?t.fg:t.bg, lt=dk===t.fg?t.bg:t.fg;
    const svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'>"
      +"<style>.i{fill:"+dk+";stroke:"+dk+"}@media (prefers-color-scheme:dark){.i{fill:"+lt+";stroke:"+lt+"}}</style>"
      +'<path class="i" style="stroke-width: 6px; stroke-linecap: square; stroke-linejoin: round;" d="M60,15 A15,15 0 0,1 45,30 L75,30 A15,15 0 0,1 60,15 L60,15 A15,30 0 0,1 45,45 L75,45 A15,30 0 0,1 60,15 L60,15 A15,60 0 0,1 45,75 L75,75 A15,60 0 0,1 60,15 M30,15 A15,15 0 0,0 15,30 A15,15 0 0,0 30,45 A15,15 0 0,0 45,30 A15,15 0 0,0 30,15 M15,60 L15,60 L45,60 M15,75 L15,75 L45,75 "/></svg>';
    let l=document.querySelector("link[rel='icon']");
    if(!l){ l=document.createElement("link"); l.rel="icon"; document.head.append(l); }
    l.type="image/svg+xml";
    l.href="data:image/svg+xml,"+encodeURIComponent(svg);
  }catch(e){}
}
function setTheme(t,save=true){
  theme={bg:t.bg,fg:t.fg,hl:t.hl};
  const s=document.documentElement.style;
  s.setProperty("--bg",t.bg); s.setProperty("--fg",t.fg); s.setProperty("--hl",t.hl);
  updateFavicon(t);
  s.setProperty("--light",lum(t.bg)>=lum(t.fg)?t.bg:t.fg);   // lighter of fg/bg: multiplied over images
  if(save) store.set("niwa.theme",JSON.stringify(theme));
}
function loadTheme(){
  let t=null;
  try{t=JSON.parse(store.get("niwa.theme"))}catch(e){}
  if(t&&t.bg&&t.fg&&t.hl) return setTheme(t,false);
  const dark=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(PRESETS[dark?"夜":"庭"],false);
}

/* ---------- data layer: in-memory cache + IndexedDB ---------- */
// stores: pages {slug,...}, images {id,blob}, imgmeta {id,w,h,bytes,dither,name,created}
const pages=new Map();
const imgMeta=new Map();
const memBlobs=new Map();     // only used when IndexedDB is unavailable
const urlP=new Map();         // image id -> Promise<objectURL>
let db=null, memOnly=false;
const MEMMSG="IndexedDB 不可用：数据只保存在当前会话，请及时导出";

function idbOpen(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error("no indexedDB"));
    const q=indexedDB.open("niwa",2);
    q.onupgradeneeded=()=>{
      const d=q.result;
      if(!d.objectStoreNames.contains("pages")) d.createObjectStore("pages",{keyPath:"slug"});
      if(!d.objectStoreNames.contains("images")) d.createObjectStore("images",{keyPath:"id"});
      if(!d.objectStoreNames.contains("imgmeta")) d.createObjectStore("imgmeta",{keyPath:"id"});
    };
    q.onsuccess=()=>{ q.result.onversionchange=()=>q.result.close(); res(q.result); };
    q.onerror=()=>rej(q.error);
  });
}
const getAllFrom=name=>new Promise((res,rej)=>{
  const r=db.transaction(name).objectStore(name).getAll();
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
});
async function loadAll(){
  try{
    db=await idbOpen();
    (await getAllFrom("pages")).forEach(p=>pages.set(p.slug,p));
    (await getAllFrom("imgmeta")).forEach(m=>imgMeta.set(m.id,m));
  }catch(e){ db=null; memOnly=true; }
}
function writeDB(put,del){
  if(!db) return;
  try{
    const tx=db.transaction("pages","readwrite"), st=tx.objectStore("pages");
    del.forEach(s=>st.delete(s));
    put.forEach(p=>st.put(p));
    tx.onerror=()=>setStatus("保存失败，请导出备份");
  }catch(e){ setStatus("保存失败，请导出备份"); }
}
function commit({put=[],del=[]}){
  del.forEach(s=>pages.delete(s));
  put.forEach(p=>pages.set(p.slug,p));
  writeDB(put,del);
}
const dirty=new Set(); let dirtyT=null;
function markDirty(s){ dirty.add(s); clearTimeout(dirtyT); dirtyT=setTimeout(flushDirty,400); }
function flushDirty(){
  clearTimeout(dirtyT);
  if(!dirty.size) return;
  const ps=[...dirty].map(s=>pages.get(s)).filter(Boolean);
  dirty.clear();
  writeDB(ps,[]);
}
const touch=p=>{ p.updated=now(); markDirty(p.slug); };

/* ---------- images ---------- */
function putImage(meta,blob){
  imgMeta.set(meta.id,meta);
  urlP.set(meta.id,Promise.resolve(URL.createObjectURL(blob)));
  if(db){
    try{
      const tx=db.transaction(["images","imgmeta"],"readwrite");
      tx.objectStore("images").put({id:meta.id,blob});
      tx.objectStore("imgmeta").put(meta);
      tx.onerror=()=>setStatus("图片保存失败，请导出备份");
    }catch(e){ setStatus("图片保存失败，请导出备份"); }
  }else memBlobs.set(meta.id,blob);
}
function saveMeta(m){ if(db){ try{ db.transaction("imgmeta","readwrite").objectStore("imgmeta").put(m); }catch(e){} } }
function dropImage(id){
  imgMeta.delete(id); memBlobs.delete(id);
  const p=urlP.get(id); if(p) p.then(u=>{ if(u) URL.revokeObjectURL(u); });
  urlP.delete(id);
  if(db){
    try{

const BAYER8=(()=>{

  for(let i=0;i<w*hh;i++) lum[i]=0.299*d[4*i]+0.587*d[4*i+1]+0.114*d[4*i+2];

}

const KERNELS={

      let q=Math.round(v[i]/step+t); q=q<0?0:q>top?top:q;

  const k=KERNELS[algo]||KERNELS.fs;
  for(let y=0;y<hh;y++) for(let x=0;x<w;x++){
    const i=y*w+x, old=v[i];

/* ---------- model ---------- */
const newTextBlock=text=>({id:uid(),type:"text",text:text||""});

const byTitle=(a,b)=>a.title.localeCompare(b.title,"zh",{numeric:true});

function normRel(arr){
  const out=[], used=new Set(), pending=[];
  for(const x of (Array.isArray(arr)?arr:[])){
    let e=null;

    else if(x&&typeof x.to==="string"&&x.to) e={to:x.to};
    if(!e) continue;
    const ok=x&&typeof x==="object"&&Number.isInteger(x.r)&&Number.isInteger(x.c)&&x.r>=0&&x.c>=0&&x.c<GC&&!used.has(x.r+","+x.c);

      const id=typeof b.id==="string"&&b.id?b.id:uid();
      if(b.type==="image") out.push({id,type:"image",img:typeof b.img==="string"&&b.img?b.img:null});

  const put=[];

  for(const p of pages.values()){

    const nb=normBlocks(p);

function createPage(raw,parent){

function rewriteLinks(text,old,nw){
  const alts=[...new Set([old,encodeURIComponent(old),encodeURI(old)])].map(escRe).join("|");
  const re=new RegExp("\\]\\(\\s*(?:\\./)?(?:"+alts+")\\s*\\)","g");

/* ---------- inline input ---------- */
function inlineInput({placeholder,list,onCommit,onCancel}){
  let done=false;
  const inp=h("input.inl",{type:"text",placeholder,spellcheck:false,autocomplete:"off"});
  if(list) inp.setAttribute("list",list);
  const cancel=()=>{ if(done) return; done=true; onCancel&&onCancel(); };
  inp.addEventListener("keydown",e=>{
    if(isComposing(e)) return;
    if(e.key==="Enter"){
      e.preventDefault();
      const v=inp.value.trim();
      if(!v) return cancel();
      if(onCommit(v)!==false) done=true;
    }else if(e.key==="Escape"){ e.stopPropagation(); cancel(); }
  });
  inp.addEventListener("blur",()=>setTimeout(cancel,0));
  return inp;
}

  const cols=[navCol(pItems,pAdd),navCol(sItems,sAdd),navCol(kItems,kAdd)];

function renderPage(m,ghost){
  shownSlug=m.slug;
  const isRoot=m.slug===ROOT;
  const storedTitle=()=>(pages.get(curSlug)||ghostOf(curSlug)).title;

  // parent (left of the title)
  if(isRoot) $("pcell").replaceChildren();
  else{
    const par=h("input.par",{type:"text",value:m.parent===ROOT?"~":m.parent,spellcheck:false,autocomplete:"off",
      title:"父页面的 slug；留空或 ~ 表示根",
      onchange:()=>setParent(par.value),
      onkeydown:e=>{
        if(isComposing(e)) return;
        if(e.key==="Enter"){ e.preventDefault(); par.blur(); }
        else if(e.key==="Escape"){ par.value=(pages.get(curSlug)||ghostOf(curSlug)).parent; par.blur(); }
      }});
    par.setAttribute("list","slugs");
    $("pcell").replaceChildren(par,h("span",null,"/"));
  }

  // title
  const title=h("input.title",{type:"text",value:m.title,placeholder:m.slug,spellcheck:false,autocomplete:"off",
    onchange:()=>{
      let v=title.value.trim();
      if(!v) v=curSlug;
      title.value=v;
      if(v===storedTitle()) return;
      const p=ensure(curSlug); p.title=v; touch(p);
      refreshTitles(); render();
    },
    onkeydown:e=>{
      if(isComposing(e)) return;
      if(e.key==="Enter"){ e.preventDefault(); focusFirst(); }
      else if(e.key==="Escape"){ title.value=storedTitle(); title.blur(); }
    }});

  // slug
  const slugIn=h("input.slug",{type:"text",value:m.slug,readOnly:isRoot,spellcheck:false,autocomplete:"off",
    title:"slug：页面的唯一名字，修改后所有引用会同步更新",
    style:`width:${chw(m.slug)}ch`,
    oninput:()=>{ slugIn.style.width=chw(slugIn.value)+"ch"; },
    onfocus:()=>{ if(!isRoot) setStatus("修改 slug 会同步更新所有引用它的地方",0); },
    onblur:()=>{ if($("status").textContent.startsWith("修改 slug")) setStatus("",1); },
    onchange:()=>{
      const old=curSlug, nw=sanitize(slugIn.value);
      if(nw===old){ slugIn.value=old; return; }
      if(!nw||nw===ROOT){ setStatus("slug 不能为空，也不能是 ~"); slugIn.value=old; return; }
      if(pages.has(nw)){ setStatus(`「${nw}」已存在，换一个 slug`); slugIn.value=old; return; }
      const n=renameSlug(old,nw);
      setStatus(n?`slug 已改为「${nw}」，同步更新了 ${n} 个页面里的引用`:`slug 已改为「${nw}」`);
    },
    onkeydown:e=>{
      if(isComposing(e)) return;
      if(e.key==="Enter"){ e.preventDefault(); slugIn.blur(); }
      else if(e.key==="Escape"){ slugIn.value=curSlug; slugIn.blur(); }
    }});

  // blocks container (drag & drop of blocks and image files)
  const box=h("div.blocks",{id:"blocks"});
  const hasType=(e,t)=>e.dataTransfer&&[...e.dataTransfer.types].includes(t);
  box.addEventListener("dragover",e=>{
    const isBlk=hasType(e,MIME), isFile=hasType(e,"Files");
    if(!isBlk&&!isFile) return;
    e.preventDefault(); e.dataTransfer.dropEffect=isBlk?"move":"copy";
    markDrop(dropPos(e));
  });
  box.addEventListener("dragleave",e=>{ if(!box.contains(e.relatedTarget)) markDrop(null); });
  box.addEventListener("drop",e=>{
    const isBlk=hasType(e,MIME), isFile=hasType(e,"Files");
    if(!isBlk&&!isFile) return;
    e.preventDefault();
    const pos=dropPos(e); markDrop(null);
    if(isBlk) moveBlock(e.dataTransfer.getData(MIME),pos);
    else{
      const f=[...e.dataTransfer.files].find(f=>f.type.startsWith("image/"));
      if(f) openImageDialog(f,id=>insertBlock(pos,"image",{img:id}));
    }
  });

  $("pbody").replaceChildren(title,slugIn,box);
  const first=m.blocks.find(b=>b.type==="text");
  renderBlocks({focusId:focusContent&&first?first.id:null,caret:"start"});
  focusContent=false;
}

function renderRel(m){
  const rel=$("rel"), top=rel.scrollTop;
  const maxR=m.related.reduce((a,x)=>Math.max(a,x.r),-1);
  const rows=Math.max(40,maxR+4);
  const g=h("div.grid",{style:`--gc:${GC}`});
  const occ=new Set(m.related.map(x=>x.r+","+x.c));
  const place=(r,c)=>`grid-row:${r+1};grid-column:${c+1}`;
  const dropOn=(el,r,c)=>{
    el.addEventListener("dragover",e=>{ if(e.dataTransfer&&[...e.dataTransfer.types].includes("text/plain")&&![...e.dataTransfer.types].includes(MIME)) e.preventDefault(); });
    el.addEventListener("drop",e=>{
      if([...e.dataTransfer.types].includes(MIME)) return;
      e.preventDefault();
      const i=parseInt(e.dataTransfer.getData("text/plain"),10);
      if(!isNaN(i)) moveLink(i,r,c);
    });
  };
  for(let r=0;r<rows;r++) for(let c=0;c<GC;c++){
    if(occ.has(r+","+c)) continue;
    const cell=h("div.cell",{style:place(r,c)});
    cell.addEventListener("click",()=>{
      if(cell.firstChild) return;
      const inp=inlineInput({placeholder:"slug",list:"slugs",
        onCommit:v=>addLink(r,c,v),onCancel:()=>cell.replaceChildren()});
      cell.append(inp); inp.focus();
    });
    dropOn(cell,r,c);
    g.append(cell);
  }
  m.related.forEach((x,i)=>{
    const ext=!!x.url, ex=ext?null:pages.get(x.to);
    const body=ext
      ? h("a.t",{href:x.url,target:"_blank",rel:"noopener noreferrer",title:x.url},x.label,h("span.dim",null," ↗"))
      : h("span.t",{onclick:()=>go(x.to)},ex?ex.title:x.to);
    if(ext) body.setAttribute("draggable","false");
    const el=h("div.rl"+(ext?".ext":(ex?"":".ghost")),{title:ext?x.url:x.to,draggable:true,style:place(x.r,x.c),
      ondragstart:e=>{ e.dataTransfer.setData("text/plain",String(i)); e.dataTransfer.effectAllowed="move"; }},
      body,
      h("button.x",{type:"button",title:"移除链接",onclick:e=>{ e.stopPropagation(); removeLink(i); }},"×"));
    if(!ext) el.dataset.slug=x.to;
    dropOn(el,x.r,x.c);
    g.append(el);
  });
  rel.replaceChildren(g);
  rel.scrollTop=top;
}

/* ---------- markdown ---------- */
function miniMD(src){
  const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const inl=s=>s.split(/(`[^`]+`)/).map(part=>{
    if(/^`[^`]+`$/.test(part)) return "<code>"+esc(part.slice(1,-1))+"</code>";
    let t=esc(part);
    t=t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>").replace(/~~([^~]+)~~/g,"<del>$1</del>");
    return t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,a,u)=>(/^(https?:|mailto:|#)/i.test(u)||!SCHEME.test(u))?'<a href="'+u+'">'+a+"</a>":m);
  }).join("");
  const LI=/^\s*[-*+]\s+/, OL=/^\s*\d+[.)]\s+/;
  const lines=src.replace(/\r\n?/g,"\n").split("\n"), out=[];
  let i=0;
  while(i<lines.length){
    const l=lines[i]; let m;
    if(/^```/.test(l)){
      const buf=[]; i++;
      while(i<lines.length&&!/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>"); continue;
    }
    if(!l.trim()){ i++; continue; }
    if((m=l.match(/^(#{1,6})\s+(.*)$/))){ out.push("<h"+m[1].length+">"+inl(m[2])+"</h"+m[1].length+">"); i++; continue; }
    if(/^(-{3,}|\*{3,})\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if(/^>/.test(l)){
      const buf=[]; while(i<lines.length&&/^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,""));
      out.push("<blockquote>"+inl(buf.join("\n")).replace(/\n/g,"<br>")+"</blockquote>"); continue;
    }
    if(LI.test(l)||OL.test(l)){
      const re=LI.test(l)?LI:OL, tag=LI.test(l)?"ul":"ol", buf=[];
      while(i<lines.length&&re.test(lines[i])) buf.push("<li>"+inl(lines[i++].replace(re,""))+"</li>");
      out.push("<"+tag+">"+buf.join("")+"</"+tag+">"); continue;
    }
    const buf=[];
    while(i<lines.length&&lines[i].trim()&&!/^(#{1,6}\s|```|>|\s*[-*+]\s|\s*\d+[.)]\s)/.test(lines[i])) buf.push(lines[i++]);
    if(!buf.length) buf.push(lines[i++]);
    out.push("<p>"+inl(buf.join("\n")).replace(/\n/g,"<br>")+"</p>");
  }
  return out.join("");
}
function renderMD(el,text){
  let html=null;
  if(window.marked&&window.DOMPurify){
    try{ html=DOMPurify.sanitize(marked.parse(text,{gfm:true,breaks:true})); }catch(e){ html=null; }
  }
  el.innerHTML=html!==null?html:miniMD(text);
  el.querySelectorAll("a[href]").forEach(a=>{
    const href=a.getAttribute("href")||"";
    if(/^https?:/i.test(href)){ a.target="_blank"; a.rel="noopener noreferrer"; }
    else if(!SCHEME.test(href)&&href[0]!=="#"){          // internal wiki link: [text](slug)
      const t=linkTarget(href);
      if(t){ a.dataset.wiki=t; a.title=t; if(!pages.has(t)) a.classList.add("ghost"); }
    }
  });
}

let ctl=new Map();      // block id -> {edit(caret)}
const autosize=ta=>{ ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; };
function focusFirst(){
  const m=pages.get(curSlug)||ghostOf(curSlug);
  const b=m.blocks.find(b=>b.type==="text");
  if(b&&ctl.has(b.id)) ctl.get(b.id).edit("start");

function neighbourText(id,dir){
  const m=pages.get(curSlug)||ghostOf(curSlug);
  let i=m.blocks.findIndex(b=>b.id===id)+dir;
  while(i>=0&&i<m.blocks.length){ if(m.blocks[i].type==="text") return m.blocks[i]; i+=dir; }
  return null;

function markDrop(pos){
  document.querySelectorAll(".ins.drop").forEach(e=>e.classList.remove("drop"));
  if(pos==null) return;
  const el=document.querySelector(`.ins[data-pos="${pos}"]`);
  if(el) el.classList.add("drop");
}
function dropPos(e){
  const box=$("blocks"), n=box.querySelectorAll(".blk").length;
  const el=e.target.closest&&e.target.closest(".ins,.blk");
  if(!el||!box.contains(el)) return n;
  if(el.classList.contains("ins")) return +el.dataset.pos;
  const idx=[...box.querySelectorAll(".blk")].indexOf(el), r=el.getBoundingClientRect();
  return e.clientY<r.top+r.height/2?idx:idx+1;
}
function insRow(pos,always){
  return h("div.ins"+(always?".always":""),{"data-pos":pos},
    h("span.ib",null,
      h("button.bt",{type:"button",title:"插入文本块",onclick:()=>insertBlock(pos,"text")},"+"),
      h("button.bt",{type:"button",title:"插入图片块",onclick:()=>insertBlock(pos,"image")},"图")));
}
function scanLinks(text,cb){
  let fence=false;
  for(const line of text.split("\n")){
    if(/^\s*```/.test(line)){ fence=!fence; continue; }
    if(fence) continue;
    const re=/(!?)\[([^\]]*)\]\(\s*([^)\s]+)\s*\)/g; let m;
    while((m=re.exec(line))){
      if(m[1]) continue;                                   // image, not a link
      const href=m[3];
      if(SCHEME.test(href)||href[0]==="#") continue;       // external or in-page
      const t=linkTarget(href); if(t) cb(t,line);
    }
  }
}
function backlinksOf(slug){
  const out=[];
  for(const p of pages.values()){
    if(p.slug===slug) continue;
    const kinds=[]; let snip="";
    if(p.related.some(r=>r.to===slug)) kinds.push("相关链接");
    let inline=false;
    for(const b of p.blocks){
      if(b.type!=="text") continue;
      scanLinks(b.text,(t,line)=>{
        if(t!==slug) return;
        inline=true;
        if(!snip) snip=line.replace(/!?\[([^\]]*)\]\([^)]*\)/g,"$1").trim().slice(0,100);
      });
    }
    if(inline) kinds.push("正文引用");
    if(kinds.length) out.push({slug:p.slug,title:p.title,kinds,snip});
  }
  return out.sort(byTitle);
}
function backEl(slug){
  const bl=backlinksOf(slug);
  if(!bl.length) return null;
  return h("div.back",null,
    h("div.bh",null,`反向链接（${bl.length}）`),
    bl.map(x=>h("div.bl",{onclick:()=>go(x.slug)},
      h("div",null,x.title,h("span",null," · "+x.kinds.join("、"))),
      x.snip?h("div.sn",null,x.snip):null)));
}
function renderBlocks(opts={}){
  const box=$("blocks"); if(!box) return;
  const m=pages.get(curSlug)||ghostOf(curSlug);
  const scroll=box.scrollTop;
  ctl=new Map();
  const kids=[insRow(0,m.blocks.length===0)];
  m.blocks.forEach((b,i)=>{ kids.push(blockEl(b)); kids.push(insRow(i+1,false)); });
  const bk=backEl(m.slug); if(bk) kids.push(bk);
  box.replaceChildren(...kids);
  box.scrollTop=scroll;
  box.querySelectorAll("textarea.bta").forEach(autosize);
  if(opts.focusId&&ctl.has(opts.focusId)) ctl.get(opts.focusId).edit(opts.caret||"end");
}

function textBlock(b){
  const wrap=h("div.btext");
  const view=h("div.md",{tabindex:0});
  const ta=h("textarea.bta",{value:b.text,placeholder:"写点什么",spellcheck:false,rows:1});
  const toView=()=>{ renderMD(view,b.text); wrap.replaceChildren(view); };
  const toEdit=caret=>{
    wrap.replaceChildren(ta); autosize(ta); ta.focus();
    const p=caret==="start"?0:ta.value.length; ta.setSelectionRange(p,p);
  };
  const idx=()=>(pages.get(curSlug)||ghostOf(curSlug)).blocks.findIndex(x=>x.id===b.id);
  ta.addEventListener("input",()=>{ const p=editable(); b.text=ta.value; touch(p); autosize(ta); });
  ta.addEventListener("blur",()=>setTimeout(()=>{
    if(ta.isConnected&&ta.parentNode===wrap&&b.text.trim()) toView();
  },0));
  ta.addEventListener("paste",e=>{
    const f=[...((e.clipboardData&&e.clipboardData.files)||[])].find(f=>f.type.startsWith("image/"));
    if(!f) return;
    e.preventDefault();
    openImageDialog(f,id=>insertBlock(idx()+1,"image",{img:id}));
  });
  ta.addEventListener("keydown",e=>{
    if(isComposing(e)) return;
    if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){ e.preventDefault(); insertBlock(idx()+1,"text"); }
    else if(e.key==="Backspace"&&ta.value===""){
      const m=pages.get(curSlug)||ghostOf(curSlug);
      if(m.blocks.length>1){ e.preventDefault(); removeBlock(b.id,{focusPrev:true}); }
    }
    else if(e.key==="Escape") ta.blur();
    else if(e.key==="ArrowUp"&&ta.selectionStart===0&&ta.selectionEnd===0){
      const n=neighbourText(b.id,-1);
      if(n&&ctl.has(n.id)){ e.preventDefault(); ctl.get(n.id).edit("end"); }
    }
    else if(e.key==="ArrowDown"&&ta.selectionStart===ta.value.length&&ta.selectionEnd===ta.value.length){
      const n=neighbourText(b.id,1);
      if(n&&ctl.has(n.id)){ e.preventDefault(); ctl.get(n.id).edit("start"); }
    }
  });
  view.addEventListener("click",e=>{
    const a=e.target.closest("a");
    if(a){ if(a.dataset.wiki){ e.preventDefault(); go(a.dataset.wiki); } return; }
    toEdit("end");
  });
  view.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target===view){ e.preventDefault(); toEdit("end"); } });
  ctl.set(b.id,{edit:toEdit});
  if(b.text.trim()) toView(); else wrap.append(ta);
  return wrap;
}

/* ---------- overlays: search / map / images / settings ---------- */
const ov=$("ov");
let overlayCleanup=null;
function runCleanup(){ if(overlayCleanup){ try{ overlayCleanup(); }catch(e){} overlayCleanup=null; } }
function closeOverlay(){ runCleanup(); ov.hidden=true; ov.replaceChildren(); }
function overlay(name,build){
  runCleanup();
  const body=h("div.ovb");
  ov.replaceChildren(h("div.ovh",null,h("span",null,name),h("button.btn",{type:"button",onclick:closeOverlay},"关闭")),body);
  ov.hidden=false;
  build(body);
}
function openSearch(){ overlay("搜索",buildSearch); }
function openMap(){ overlay(`地图（${pages.size} 页）`,buildMap); }
function openSettings(){ overlay("设置",buildSettings); }
function openGallery(pick){ overlay(pick?"选择图片":"图片",b=>buildGallery(b,pick)); }

function buildSearch(body){
  const inp=h("input.big",{type:"text",placeholder:"搜索标题、slug、内容",spellcheck:false,autocomplete:"off"});
  const res=h("div");
  let sel=0, hits=[];
  const snippet=(text,q)=>{
    const i=text.toLowerCase().indexOf(q);
    if(!q||i<0) return "";
    return text.slice(Math.max(0,i-20),i+40).replace(/\s+/g," ");
  };
  function draw(){
    const q=inp.value.trim().toLowerCase();
    let list=[...pages.values()];
    if(q){
      list=list.filter(p=>(p.title+"\n"+p.slug+"\n"+pageText(p)).toLowerCase().includes(q));
      const sc=p=>p.title.toLowerCase().includes(q)?0:p.slug.toLowerCase().includes(q)?1:2;
      list.sort((a,b)=>sc(a)-sc(b)||b.updated-a.updated);
    }else list.sort((a,b)=>b.updated-a.updated);
    hits=list.slice(0,60);
    if(sel>=hits.length) sel=Math.max(0,hits.length-1);
    res.replaceChildren(...(hits.length?hits.map((p,i)=>{
      const sn=snippet(pageText(p),q);
      return h("div.hit"+(i===sel?".sel":""),{onclick:()=>go(p.slug)},
        h("div",null,p.slug===ROOT?"~/":p.title,p.slug!==p.title&&p.slug!==ROOT?h("span.dim",null," "+p.slug):null),
        sn?h("div.snip",null,sn):null);
    }):[h("div.dim",null,"没有匹配的页面")]));
  }
  inp.addEventListener("input",()=>{ sel=0; draw(); });
  inp.addEventListener("keydown",e=>{
    if(isComposing(e)) return;
    if(e.key==="ArrowDown"){ e.preventDefault(); sel=Math.min(hits.length-1,sel+1); draw(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); sel=Math.max(0,sel-1); draw(); }
    else if(e.key==="Enter"&&hits[sel]){ e.preventDefault(); go(hits[sel].slug); }
  });
  body.append(inp,res); draw();
  setTimeout(()=>inp.focus(),0);
}
function buildMap(body){
  body.classList.add("map");
  const tree=h("div.maptree"), pane=h("div.mapgraph");
  body.append(h("div.mapwrap",null,tree,pane));
  const seen=new Set();
  const walk=(p,d)=>{
    if(seen.has(p.slug)) return; seen.add(p.slug);
    tree.append(h("div.mn"+(p.slug===curSlug?".cur":""),{style:`padding-left:${d*1.4}em`,onclick:()=>go(p.slug)},
      p.slug===ROOT?"~/":p.title,
      p.slug!==p.title&&p.slug!==ROOT?h("span.dim",null," "+p.slug):null));
    childrenOf(p.slug).forEach(c=>walk(c,d+1));
  };
  const root=pages.get(ROOT); if(root) walk(root,0);
  initGraph(pane);
}

/* ---------- global graph (force-graph, loaded on first use) ---------- */
const FG_URL="https://cdn.jsdelivr.net/npm/force-graph@1.51.4/dist/force-graph.min.js";
let fgLoad=null;
function loadForceGraph(){
  if(window.ForceGraph) return Promise.resolve();
  if(!fgLoad) fgLoad=new Promise((res,rej)=>{
    const sc=document.createElement("script");
    sc.src=FG_URL; sc.onload=res;
    sc.onerror=()=>{ fgLoad=null; rej(new Error("force-graph failed to load")); };
    document.head.append(sc);
  });
  return fgLoad;
}
function buildGraphData(){
  const nodes=new Map(), links=new Map();
  const rank={tree:0,related:1,inline:2};
  const node=id=>{
    let n=nodes.get(id);
    if(!n){ const pg=pages.get(id); n={id,title:pg?pg.title:id,ghost:!pg,deg:0}; nodes.set(id,n); }
    return n;
  };
  const link=(a,b,kind)=>{
    if(!a||!b||a===b) return;
    node(a); node(b);
    const key=a<b?a+"\u0000"+b:b+"\u0000"+a, l=links.get(key);
    if(!l) links.set(key,{source:a,target:b,kind,kinds:[kind]});
    else{ if(!l.kinds.includes(kind)) l.kinds.push(kind); if(rank[kind]<rank[l.kind]) l.kind=kind; }
  };
  for(const p of pages.values()){
    node(p.slug);
    if(p.slug!==ROOT&&p.parent) link(p.parent,p.slug,"tree");
    for(const r of p.related) if(r.to) link(p.slug,r.to,"related");
    for(const b of p.blocks) if(b.type==="text") scanLinks(b.text,t=>link(p.slug,t,"inline"));
  }
  const ls=[...links.values()];
  ls.forEach(l=>{ nodes.get(l.source).deg++; nodes.get(l.target).deg++; });
  return {nodes:[...nodes.values()],links:ls};
}
function rgb(hex){ const n=parseInt(hex.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
const rgba=(hex,a)=>{ const c=rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const mixHex=(a,b,t)=>{ const x=rgb(a), y=rgb(b); return `rgb(${[0,1,2].map(i=>Math.round(x[i]*t+y[i]*(1-t))).join(",")})`; };

function initGraph(pane){
  const msg=h("div.gmsg",null,"正在加载图…");
  pane.append(msg);
  loadForceGraph().then(()=>{
    if(!pane.isConnected) return;
    const data=buildGraphData();
    if(data.nodes.length<2){ msg.textContent="还没有足够的页面可以画图"; return; }
    msg.remove();
    const C={fg:theme.fg,hl:theme.hl,dim:mixHex(theme.fg,theme.bg,.48),faint:mixHex(theme.fg,theme.bg,.1)};
    const FONT=getComputedStyle(document.body).fontFamily||"sans-serif";
    const radius=n=>3+Math.sqrt(n.deg)*1.6;
    let hover=null, nb=new Set(), fitted=false;
    const ends=l=>[l.source&&l.source.id!==undefined?l.source.id:l.source, l.target&&l.target.id!==undefined?l.target.id:l.target];
    const touching=l=>{ if(!hover) return false; const [a,b]=ends(l); return a===hover.id||b===hover.id; };
    const alphaOf={tree:.55,related:.6,inline:.3};

    const g=new ForceGraph(pane)
      .width(pane.clientWidth||600).height(pane.clientHeight||400)
      .backgroundColor("rgba(0,0,0,0)")
      .graphData(data)
      .nodeLabel(()=>"")
      .minZoom(.3).maxZoom(8)
      .warmupTicks(80).cooldownTicks(150)
      .nodeCanvasObjectMode(()=>"replace")
      .nodeCanvasObject((n,ctx,scale)=>{
        const r=radius(n), cur=n.id===curSlug, hot=hover===n, faded=hover&&!hot&&!nb.has(n.id);
        ctx.globalAlpha=faded?.25:1;
        ctx.beginPath(); ctx.arc(n.x,n.y,r,0,2*Math.PI);
        if(n.ghost){ ctx.fillStyle=C.faint; ctx.fill(); ctx.lineWidth=1.2/scale; ctx.strokeStyle=C.dim; ctx.stroke(); }
        else{ ctx.fillStyle=(cur||hot)?C.hl:C.fg; ctx.fill(); }
        if(cur){ ctx.beginPath(); ctx.arc(n.x,n.y,r+3/scale+1,0,2*Math.PI); ctx.lineWidth=1.5/scale; ctx.strokeStyle=C.hl; ctx.stroke(); }
        if(cur||hot||(hover&&nb.has(n.id))||scale>1.3){
          const fs=12/scale, label=n.id===ROOT?"~/":n.title;
          ctx.font=`${cur||hot?"700 ":""}${fs}px ${FONT}`;
          ctx.textAlign="center"; ctx.textBaseline="top";
          ctx.lineJoin="round"; ctx.lineWidth=3/scale; ctx.strokeStyle=C.faint;
          ctx.strokeText(label,n.x,n.y+r+2/scale);
          ctx.fillStyle=n.ghost?C.dim:C.fg; ctx.fillText(label,n.x,n.y+r+2/scale);
        }
        ctx.globalAlpha=1;
      })
      .nodePointerAreaPaint((n,color,ctx)=>{ ctx.fillStyle=color; ctx.beginPath(); ctx.arc(n.x,n.y,radius(n)+2,0,2*Math.PI); ctx.fill(); })
      .linkColor(l=>touching(l)?C.hl:rgba(theme.fg,(alphaOf[l.kind]||.3)*(hover?.35:1)))
      .linkWidth(l=>touching(l)?2:1)
      .linkLineDash(l=>l.kind==="related"?[4,3]:null)
      .onNodeHover(n=>{
        hover=n||null; nb=new Set();
        if(n) for(const l of data.links){ const [a,b]=ends(l); if(a===n.id) nb.add(b); else if(b===n.id) nb.add(a); }
        pane.style.cursor=n?"pointer":"";
      })
      .onNodeClick(n=>go(n.id))
      .onEngineStop(()=>{ if(!fitted){ fitted=true; g.zoomToFit(300,40); } });
    g.d3Force("charge").strength(-45);
    g.d3Force("link").distance(l=>l.kind==="tree"?28:44);

    pane.append(h("div.legend",null,"实线 父子 · 虚线 相关链接 · 浅线 正文引用 · 空心 尚未创建的页面"));
    let ro=null;
    if(typeof ResizeObserver!=="undefined"){ ro=new ResizeObserver(()=>g.width(pane.clientWidth||600).height(pane.clientHeight||400)); ro.observe(pane); }
    overlayCleanup=()=>{ if(ro) ro.disconnect(); if(g._destructor) g._destructor(); pane.replaceChildren(); };
    if(window.__NIWA_TEST&&window.__niwa) window.__niwa.graph=g;
  }).catch(()=>{
    msg.textContent="图需要联网加载 force-graph（jsDelivr），这次没有加载成功。左边的树仍然可用。";
  });
}

/* image dialog: preview + grayscale / dither, saved as PNG (original is not kept) */
async function openImageDialog(file,onDone){
  let bmp;
  try{ bmp=await createImageBitmap(file); }
  catch(e){ setStatus("无法读取这个图片"); return; }
  overlay("插入图片",body=>buildImageDialog(body,bmp,onDone));
}
function buildImageDialog(body,bmp,onDone){
  const st={mode:"dither",algo:"fs",levels:2,edge:640,bright:0,contrast:0};
  try{
    const sv=JSON.parse(store.get("niwa.imgopts")||"{}")||{};
    if(["gray","dither"].includes(sv.mode)) st.mode=sv.mode;
    if(["fs","atk","bayer"].includes(sv.algo)) st.algo=sv.algo;
    if([2,4].includes(sv.levels)) st.levels=sv.levels;
    if([320,480,640,800,1024,1600].includes(sv.edge)) st.edge=sv.edge;
    for(const k of ["bright","contrast"]) if(Number.isFinite(sv[k])&&sv[k]>=-100&&sv[k]<=100) st[k]=sv[k];
  }catch(e){}
  const bases={};
  const canvas=h("canvas.prev"), info=h("div.dim.msg");
  let timer=null, token=0, cur=null;
  function run(){
    const b=bases[st.edge]||(bases[st.edge]=makeBase(bmp,st.edge));
    const v=toneMap(b.lum,st.bright,st.contrast);
    const g=st.mode==="gray"?grayOut(v):ditherOut(v,b.w,b.h,st.algo,st.levels);
    canvas.width=b.w; canvas.height=b.h;
    const x=canvas.getContext("2d"), img=x.createImageData(b.w,b.h);
    for(let i=0;i<g.length;i++){ const o=i*4; img.data[o]=img.data[o+1]=img.data[o+2]=g[i]; img.data[o+3]=255; }
    x.putImageData(img,0,0);
    canvas.style.imageRendering=st.mode==="dither"?"pixelated":"auto";
    cur={w:b.w,h:b.h,dither:st.mode==="dither"};
    const my=++token;
    canvas.toBlob(bl=>{ if(my===token&&bl) info.textContent=`${b.w}×${b.h} · 约 ${fmtKB(bl.size)}`; },"image/png");
  }
  const sched=()=>{ clearTimeout(timer); timer=setTimeout(run,40); };
  const rows=[];
  function opt(name,key,items,only){
    const row=h("div.row",null,h("span.lab",null,name));
    const btns=items.map(([lab,val])=>h("button.btn",{type:"button",onclick:()=>{ st[key]=val; sync(); sched(); }},lab));
    row.append(...btns);
    rows.push({row,only,btns,key,items});
    return row;
  }
  function slider(name,key,only){
    const val=h("span.val",null,String(st[key]));
    const inp=h("input",{type:"range",min:-100,max:100,value:st[key],oninput:()=>{ st[key]=+inp.value; val.textContent=inp.value; sched(); }});
    return h("div.row",null,h("span.lab",null,name),inp,val);
  }
  function sync(){
    rows.forEach(r=>{
      r.btns.forEach((b,i)=>b.classList.toggle("on",st[r.key]===r.items[i][1]));
      if(r.only) r.row.hidden=st.mode!=="dither";
    });
  }
  const controls=[
    opt("模式","mode",[["灰度","gray"],["抖动","dither"]]),
    opt("抖动算法","algo",[["Floyd–Steinberg","fs"],["Atkinson","atk"],["Bayer 有序","bayer"]],true),
    opt("灰阶","levels",[["黑白 2 级",2],["4 级",4]],true),
    opt("最大边","edge",[["320",320],["480",480],["640",640],["800",800],["1024",1024],["1600",1600]]),
    slider("亮度","bright"),
    slider("对比度","contrast")
  ];
  let saving=false;
  async function save(){
    if(saving) return; saving=true;
    store.set("niwa.imgopts",JSON.stringify(st));
    clearTimeout(timer); run();
    const info2=cur;
    canvas.toBlob(async bl=>{
      if(!bl){ setStatus("图片处理失败"); return; }
      const id=await saveImage(bl,info2);
      if(bmp.close) bmp.close();
      closeOverlay(); onDone(id);
    },"image/png");
  }
  const saveBtn=h("button.btn.go",{type:"button",onclick:save},"保存");
  body.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!isComposing(e)){ e.preventDefault(); save(); } });
  body.append(
    h("div.prevbox",null,h("span.duo",null,canvas)),
    ...controls,
    h("div.dim",null,"抖动图建议最大边不超过正文宽度（约 640），避免显示时被缩放。按 Enter 保存。"),
    info,
    h("div.row",null,
      saveBtn,
      h("button.btn",{type:"button",onclick:closeOverlay},"取消")));
  sync(); run(); saveBtn.focus();
}

/* image gallery */
function buildGallery(body,pick){
  body.style.maxWidth="60rem";
  function draw(){
    const usage=imageUsage();
    const metas=[...imgMeta.values()].sort((a,b)=>b.created-a.created);
    const total=metas.reduce((n,m)=>n+m.bytes,0);
    const unused=metas.filter(m=>!usage.has(m.id));
    const head=h("div.row",null,h("span.dim",null,`${metas.length} 张 · ${fmtKB(total)}`));
    if(!pick&&unused.length){
      const label=`清理 ${unused.length} 张未引用的图片`;
      let armed=false, t=null;
      const btn=h("button.btn",{type:"button",onclick:()=>{
        if(!armed){
          armed=true; btn.textContent=`确认清理这 ${unused.length} 张？再点一次`;
          t=setTimeout(()=>{ armed=false; btn.textContent=label; },4000);
        }else{
          clearTimeout(t);
          unused.forEach(m=>dropImage(m.id));
          setStatus(`已清理 ${unused.length} 张未引用的图片`);
          draw();
        }
      }},label);
      head.append(btn);
    }
    const grid=h("div.gal");
    metas.forEach(m=>{
      const used=usage.get(m.id);
      const count=used?[...used.values()].reduce((a,b)=>a+b,0):0;
      const card=h("div.gc");
      card.append(
        h("div.gth"+(pick?".pk":""),{onclick:pick?()=>{ closeOverlay(); pick(m.id); }:null},duoImg(m.id)),
        h("div.dim.gm",null,`${m.w}×${m.h} · ${fmtKB(m.bytes)} · ${count?count+" 处引用":"未引用"}`));
      if(used){
        const links=[...used.keys()].slice(0,3).map(s=>h("span.gl",{onclick:()=>go(s)},(pages.get(s)||{title:s}).title));
        card.append(h("div.gu",null,links.flatMap((l,i)=>i?["、",l]:[l]),used.size>3?h("span.dim",null,` 等 ${used.size} 页`):null));
      }
      card.append(h("input.gname",{type:"text",value:m.name||"",placeholder:"备注",spellcheck:false,
        onchange:e=>{ m.name=e.target.value.trim(); saveMeta(m); }}));
      if(!pick){
        const del=h("div.gd");
        const showBtn=()=>del.replaceChildren(h("button.btn.sm",{type:"button",onclick:ask},"删除"));
        const remove=()=>{ dropImage(m.id); renderBlocks(); draw(); };
        function ask(){
          if(!count) return remove();
          del.replaceChildren(
            h("span.dim",null,`被 ${count} 处引用，删除后这些块会显示为占位。`),
            h("button.btn.sm.go",{type:"button",onclick:remove},"确认删除"),
            h("button.btn.sm",{type:"button",onclick:showBtn},"取消"));
        }
        showBtn(); card.append(del);
      }
      grid.append(card);
    });
    body.replaceChildren(head,metas.length?grid:h("div.dim",null,"还没有图片。在页面里插入图片块，或把图片拖进页面。"));
  }
  draw();
}

/* settings */
async function exportJSON(){
  const imgs=[];
  for(const m of imgMeta.values()){
    const b=await getBlob(m.id); if(!b) continue;
    imgs.push({...m,data:await blobToDataURL(b)});
  }
  return JSON.stringify({app:"niwa",version:2,exported:now(),pages:[...pages.values()],images:imgs},null,2);
}
function buildSettings(body){
  const msg=h("div.dim.msg"), say=t=>{ msg.textContent=t; };

  // theme
  const inputs={};
  const mk=(k,label)=>{
    const i=h("input",{type:"color",value:theme[k],oninput:()=>setTheme({...theme,[k]:i.value})});
    inputs[k]=i; return h("label.cl",null,i,h("span",null,label));
  };
  const presets=Object.entries(PRESETS).map(([n,t])=>
    h("button.btn",{type:"button",onclick:()=>{ setTheme(t); for(const k in inputs) inputs[k].value=t[k]; }},n));
  const themeSec=h("section",null,h("h3",null,"主题"),
    h("div.row",null,presets),
    h("div.row",null,mk("fg","前景"),mk("bg","背景"),mk("hl","高亮")));

  // data
  const io=h("textarea.io",{spellcheck:false,placeholder:"导出的 JSON 会出现在这里；也可以把备份粘贴到这里再导入"});
  const file=h("input",{type:"file",accept:".json,application/json",hidden:true,
    onchange:()=>{
      const f=file.files[0]; if(!f) return;
      const rd=new FileReader(); rd.onload=()=>importData(String(rd.result)); rd.readAsText(f); file.value="";
    }});
  async function importData(text){
    let j; try{ j=JSON.parse(text); }catch(e){ return say("不是有效的 JSON"); }
    const arr=Array.isArray(j)?j:(j&&j.pages);
    if(!Array.isArray(arr)) return say("找不到 pages 数组");
    const str=v=>typeof v==="string"?v:"", num=v=>Number.isFinite(v)?v:now();
    let ni=0;
    if(j&&!Array.isArray(j)&&Array.isArray(j.images)){
      for(const im of j.images){
        if(!im||typeof im.id!=="string"||typeof im.data!=="string"||imgMeta.has(im.id)) continue;
        const blob=dataURLToBlob(im.data); if(!blob) continue;
        putImage({id:im.id,w:+im.w||0,h:+im.h||0,bytes:blob.size,dither:!!im.dither,name:str(im.name),created:num(im.created)},blob);
        ni++;
      }
    }
    const put=[];
    for(const x of arr){
      if(!x||typeof x.slug!=="string"||!x.slug) continue;
      put.push({slug:x.slug,title:str(x.title)||x.slug,
        parent:x.slug===ROOT?"":(str(x.parent)||ROOT),
        related:normRel(x.related),blocks:normBlocks(x),created:num(x.created),updated:num(x.updated)});
    }
    commit({put}); normalize(); render(true);
    say(`导入了 ${put.length} 个页面、${ni} 张图片（同 slug 的页面已被覆盖）`);
  }
  const lastExp=Number(store.get("niwa.lastExport"))||0;
  const days=lastExp?Math.floor((now()-lastExp)/864e5):null;
  const dataSec=h("section",null,h("h3",null,"数据"),
    h("div.dim.row",null,
      (lastExp?(days===0?"今天已导出过":`上次导出在 ${days} 天前`):"还没有导出过备份")
      +` · ${pages.size} 个页面，${imgMeta.size} 张图片`),
    h("div.row",null,
      h("button.btn",{type:"button",onclick:async()=>{
        say("正在导出…"); io.value=await exportJSON(); io.select();
        store.set("niwa.lastExport",String(now())); say("已导出到文本框，可复制保存（图片以 base64 内嵌）");
      }},"导出到文本框"),
      h("button.btn",{type:"button",onclick:async()=>{
        try{
          const a=h("a",{href:URL.createObjectURL(new Blob([await exportJSON()],{type:"application/json"})),download:`niwa-${new Date().toISOString().slice(0,10)}.json`});
          document.body.append(a); a.click(); a.remove();
          store.set("niwa.lastExport",String(now())); say("已请求下载；如果没有反应，请用「导出到文本框」");
        }catch(e){ say("下载失败，请用「导出到文本框」"); }
      }},"下载 .json"),
      h("button.btn",{type:"button",onclick:()=>importData(io.value)},"导入文本框内容"),
      h("button.btn",{type:"button",onclick:()=>file.click()},"选择文件导入"),file),
    io);

  // storage
  const pst=h("div.dim");
  const checkP=async()=>{
    try{ pst.textContent=(await navigator.storage.persisted())?"已启用持久存储":"尚未启用持久存储（浏览器可能在空间紧张时清理数据）"; }
    catch(e){ pst.textContent=memOnly?MEMMSG:"此环境无法查询存储状态"; }
  };
  const storeSec=h("section",null,h("h3",null,"存储"),pst,
    h("div.row",null,h("button.btn",{type:"button",onclick:async()=>{
      try{ say(await navigator.storage.persist()?"已获批持久存储":"浏览器未批准持久存储"); checkP(); }
      catch(e){ say("无法请求持久存储"); }
    }},"请求持久存储")));
  checkP();

  body.append(h("div.st",null,themeSec,dataSec,storeSec,msg));
}

if(window.__NIWA_TEST) window.__niwa={pages,imgMeta,go,createPage,renameSlug,setParent,deletePage,insertBlock,removeBlock,moveBlock,
